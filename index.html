<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://*.sndcdn.com; media-src 'self' blob: file: https://*.sndcdn.com https://*.soundcloud.cloud; connect-src 'self' https://*.sndcdn.com https://*.soundcloud.cloud https://lrclib.net; worker-src blob:">
  <title>Cloudwave</title>
  <link rel="stylesheet" href="node_modules/@fontsource-variable/inter/index.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 3.5v17M16 8v8M20 10.5v3"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.2 12 3.5l8.5 6.7V19.5a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"><path d="M12 20s-7.4-4.5-9.1-9.2C1.8 7.6 4 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.9 1.2-1.8 2.8-2.9 4.8-2.9 3.2 0 5.4 3.1 4.3 6.3C19.4 15.5 12 20 12 20z"/></symbol>
      <symbol id="i-heart-filled" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20s-7.4-4.5-9.1-9.2C1.8 7.6 4 4.5 7.2 4.5c2 0 3.6 1.1 4.8 2.9 1.2-1.8 2.8-2.9 4.8-2.9 3.2 0 5.4 3.1 4.3 6.3C19.4 15.5 12 20 12 20z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M7.5 4.6v14.8a1 1 0 0 0 1.5.86l12.3-7.4a1 1 0 0 0 0-1.72L9 3.74a1 1 0 0 0-1.5.86z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect fill="currentColor" x="6" y="4" width="4.2" height="16" rx="1.3"/><rect fill="currentColor" x="13.8" y="4" width="4.2" height="16" rx="1.3"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path fill="currentColor" stroke-linejoin="round" d="M18.5 5.5v13L8.5 12z"/><path d="M5.5 5v14"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path fill="currentColor" stroke-linejoin="round" d="M5.5 5.5v13l10-6.5z"/><path d="M18.5 5v14"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M4 20 20 4M20 16v4h-4M14.5 14.5 20 20M4 4l5 5"/></symbol>
      <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2.5 3.5 3.5L17 9.5"/><path d="M3.5 11v-1a4 4 0 0 1 4-4h13"/><path d="M7 21.5 3.5 18 7 14.5"/><path d="M20.5 13v1a4 4 0 0 1-4 4h-13"/></symbol>
      <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3.5v6h3L11 19z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18.5 6a8.5 8.5 0 0 1 0 12"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3.5v6h3L11 19z"/><path d="m16 9.5 5 5M21 9.5l-5 5"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M9.5 16.5 5 12l4.5-4.5M5 12h10"/></symbol>
      <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></symbol>
      <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-playlist" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M4 11h12M4 16h7"/><path fill="currentColor" d="M15 14v6l5-3z"/></symbol>
      <symbol id="i-queue" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11M4 12h11M4 17h7"/><path d="M17.5 14v6.5M20.5 15.5l-3-1.5"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3.5 4v4h4M12 7.5V12l3 2"/></symbol>
      <symbol id="i-radio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></symbol>
      <symbol id="i-pip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="12" y="12" width="7" height="5" rx="1" fill="currentColor"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
      <symbol id="i-lyrics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></symbol>
      <symbol id="i-grip" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.92 2.92l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56v.17a2.06 2.06 0 1 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.92-2.92l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03h-.17a2.06 2.06 0 1 1 0-4.12h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.92-2.92l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56v-.17a2.06 2.06 0 1 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.92 2.92l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03h.17a2.06 2.06 0 1 1 0 4.12h-.09a1.7 1.7 0 0 0-1.56 1.03z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 10 12 14.5 16.5 10"/><path d="M4.5 17v2.5a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1V17"/></symbol>
    </defs>
  </svg>

  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="#i-logo"/></svg>
        <span>Cloudwave</span>
      </div>

      <nav class="nav" id="nav">
        <span class="nav-indicator" aria-hidden="true"></span>
        <button class="nav-item" data-view="home"><svg aria-hidden="true"><use href="#i-home"/></svg>Главная</button>
        <button class="nav-item" data-view="search"><svg aria-hidden="true"><use href="#i-search"/></svg>Поиск</button>
        <button class="nav-item" data-view="likes"><svg aria-hidden="true"><use href="#i-heart"/></svg>Лайки</button>
        <button class="nav-item" data-view="library"><svg aria-hidden="true"><use href="#i-playlist"/></svg>Моё</button>
        <button class="nav-item" data-view="settings"><svg aria-hidden="true"><use href="#i-settings"/></svg>Настройки</button>
      </nav>

      <div class="sidebar-section">
        <p class="eyebrow">Плейлисты</p>
        <div class="sidebar-playlists" id="sidebar-playlists"></div>
      </div>

      <div class="account" id="account"></div>
    </aside>

    <main class="main" id="main">
      <header class="topbar">
        <label class="search">
          <svg aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search-input" type="search" placeholder="Треки, авторы, плейлисты" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </label>
      </header>
      <div class="view" id="view"></div>
    </main>

    <section class="now" id="now" hidden aria-label="Сейчас играет">
      <div class="now-backdrop"><img id="now-backdrop" alt=""></div>
      <button class="icon-btn now-close" id="now-close" aria-label="Свернуть"><svg><use href="#i-down"/></svg></button>
      <button class="icon-btn now-karaoke" id="now-karaoke" aria-label="Караоке на весь экран" aria-pressed="false" hidden><svg><use href="#i-expand"/></svg></button>
      <div class="now-body">
        <div class="art now-art" id="now-art"></div>
        <div class="now-lyrics" id="now-lyrics" hidden></div>
        <div class="now-info">
          <p class="eyebrow" id="now-context">Сейчас играет</p>
          <h1 class="now-title" id="now-title"></h1>
          <button class="link now-artist" id="now-artist"></button>
          <dl class="now-stats" id="now-stats"></dl>
          <div class="wave" id="wave">
            <canvas id="wave-canvas"></canvas>
          </div>
          <div class="now-times"><span id="now-cur">0:00</span><span id="now-dur">0:00</span></div>
          <div class="now-actions">
            <button class="btn like-btn" id="now-like" aria-pressed="false" hidden><svg aria-hidden="true"><use href="#i-heart"/></svg><span>Лайкнуть</span></button>
            <button class="btn" id="now-lyrics-toggle" aria-pressed="false"><svg aria-hidden="true"><use href="#i-lyrics"/></svg><span>Текст</span></button>
            <button class="btn" id="now-queue"><svg aria-hidden="true"><use href="#i-queue"/></svg><span>Очередь</span></button>
            <a class="link now-source" id="now-source" target="_blank"><svg aria-hidden="true"><use href="#i-external"/></svg>Открыть в SoundCloud</a>
          </div>
        </div>
      </div>
    </section>

    <footer class="player" id="player">
      <div class="player-left">
        <button class="player-track" id="open-now" aria-label="Развернуть плеер" disabled>
          <span class="art player-art" id="player-art"></span>
          <span class="player-meta">
            <span class="player-title" id="player-title">Ничего не играет</span>
            <span class="player-artist" id="player-artist">Выбери трек в списке</span>
          </span>
        </button>
        <button class="icon-btn like-btn" id="like" aria-label="Лайкнуть" aria-pressed="false" hidden><svg><use href="#i-heart"/></svg></button>
      </div>

      <div class="player-center">
        <div class="controls">
          <button class="icon-btn" id="shuffle" aria-label="Перемешать" aria-pressed="false"><svg><use href="#i-shuffle"/></svg></button>
          <button class="icon-btn" id="prev" aria-label="Предыдущий"><svg><use href="#i-prev"/></svg></button>
          <button class="play-btn" id="play" aria-label="Играть"><svg><use href="#i-play"/></svg></button>
          <button class="icon-btn" id="next" aria-label="Следующий"><svg><use href="#i-next"/></svg></button>
          <button class="icon-btn" id="repeat" aria-label="Повторять очередь" aria-pressed="false"><svg><use href="#i-repeat"/></svg></button>
        </div>
        <div class="seek">
          <span class="time" id="time-cur">0:00</span>
          <input class="range" id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Перемотка">
          <span class="time" id="time-dur">0:00</span>
        </div>
      </div>

      <div class="player-side">
        <span class="badge" id="preview-badge" hidden>Превью 30 с</span>
        <button class="icon-btn" id="mini-mode" aria-label="Мини-плеер поверх окон" aria-pressed="false" hidden><svg><use href="#i-pip"/></svg></button>
        <button class="icon-btn" id="queue-toggle" aria-label="Очередь" aria-pressed="false"><svg><use href="#i-queue"/></svg></button>
        <button class="icon-btn" id="mute" aria-label="Выключить звук"><svg><use href="#i-volume"/></svg></button>
        <input class="range range-volume" id="volume" type="range" min="0" max="100" value="80" aria-label="Громкость">
      </div>
    </footer>

    <section class="queue" id="queue" hidden aria-label="Очередь">
      <header class="queue-head">
        <h2>Очередь</h2>
        <button class="icon-btn" id="queue-close" aria-label="Закрыть очередь"><svg><use href="#i-close"/></svg></button>
      </header>
      <div class="queue-body" id="queue-body"></div>
    </section>
  </div>

  <div class="menu" id="track-menu" role="menu" hidden>
    <button class="menu-item" role="menuitem" data-menu="next"><svg aria-hidden="true"><use href="#i-queue"/></svg>Играть следующим</button>
    <button class="menu-item" role="menuitem" data-menu="add"><svg aria-hidden="true"><use href="#i-playlist"/></svg>В очередь</button>
    <button class="menu-item" role="menuitem" data-menu="station"><svg aria-hidden="true"><use href="#i-radio"/></svg>Станция по треку</button>
    <button class="menu-item" role="menuitem" data-menu="share"><svg aria-hidden="true"><use href="#i-external"/></svg>Поделиться</button>
    <button class="menu-item" role="menuitem" data-menu="artist"><svg aria-hidden="true"><use href="#i-user"/></svg>К автору</button>
    <button class="menu-item" role="menuitem" data-menu="playlist"><svg aria-hidden="true"><use href="#i-playlist"/></svg>В плейлист</button>
    <button class="menu-item" role="menuitem" data-menu="download"><svg aria-hidden="true"><use href="#i-download"/></svg>Скачать для офлайна</button>
    <button class="menu-item" role="menuitem" data-menu="removeFromPlaylist" hidden><svg aria-hidden="true"><use href="#i-close"/></svg>Убрать из плейлиста</button>
  </div>

  <dialog class="dialog" id="playlist-dialog">
    <p class="eyebrow">Плейлист</p>
    <div class="playlist-picker" id="playlist-picker"></div>
    <form id="new-playlist-form" class="field-row">
      <input class="field" name="name" placeholder="Название нового плейлиста" required autocomplete="off">
      <button class="btn">Создать</button>
    </form>
    <form method="dialog"><button class="btn btn-block">Готово</button></form>
  </dialog>

  <dialog class="dialog" id="rename-dialog">
    <p class="eyebrow">Название плейлиста</p>
    <form id="rename-form" class="field-row">
      <input class="field" name="name" required autocomplete="off">
      <button class="btn">Сохранить</button>
    </form>
  </dialog>

  <dialog class="dialog" id="pair-dialog">
    <p class="eyebrow">Вход на iPhone</p>
    <p class="dialog-code" id="pair-code"></p>
    <p>Открой <b id="pair-url"></b> в Safari, нажми «Войти в SoundCloud» и введи этот код. Он действует 5 минут и срабатывает один раз.</p>
    <form method="dialog"><button class="btn btn-block">Готово</button></form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <audio id="audio" preload="auto"></audio>

  <script src="node_modules/hls.js/dist/hls.min.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
