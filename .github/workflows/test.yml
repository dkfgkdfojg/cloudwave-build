name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # На линуксе окну нужен дисплей — виртуальный Xvfb.
      - name: Тесты (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Тесты (Windows)
        if: runner.os == 'Windows'
        run: npm test
